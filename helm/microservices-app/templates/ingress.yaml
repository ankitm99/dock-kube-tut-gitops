{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservices-app.name" . }}-ingress
  labels:
    {{- include "microservices-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: {{ .Values.productService.port }}
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: {{ .Values.orderService.port }}
          {{- if .Values.frontendService.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: {{ .Values.frontendService.port }}
          {{- end }}
{{- end }}
