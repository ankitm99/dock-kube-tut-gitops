apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    {{- include "microservices-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orderService.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"
          imagePullPolicy: {{ .Values.orderService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.orderService.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfile | quote }}
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:{{ .Values.productService.port }}"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/orderdb"
            - name: SPRING_DATASOURCE_DRIVER
              value: "org.postgresql.Driver"
            - name: SPRING_DATASOURCE_USERNAME
              {{ if .Values.postgres.credentials.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentials.secretName | quote }}
                  key: {{ .Values.postgres.credentials.usernameKey | quote }}
              {{ else }}
              value: {{ .Values.postgres.credentials.username | quote }}
              {{ end }}
            - name: SPRING_DATASOURCE_PASSWORD
              {{ if .Values.postgres.credentials.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentials.secretName | quote }}
                  key: {{ .Values.postgres.credentials.passwordKey | quote }}
              {{ else }}
              value: {{ .Values.postgres.credentials.password | quote }}
              {{ end }}
          resources:
            {{- toYaml .Values.orderService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.orderService.port }}
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.orderService.port }}
            initialDelaySeconds: 20
            periodSeconds: 5
